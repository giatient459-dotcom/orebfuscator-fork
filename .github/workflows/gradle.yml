name: Build Orebfuscator

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set BUILD_VERSION
      run: |
        echo "BUILD_VERSION=$(
          git describe --tags $(git rev-list --tags --max-count=1) 2>/dev/null \
          || echo "5.0.0"
        )-b$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build -PbuildVersion="$BUILD_VERSION"

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: orebfuscator-paper
        path: orebfuscator-bukkit/build/libs/*.jar
