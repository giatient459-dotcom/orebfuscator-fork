name: Build Orebfuscator

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Checkout code
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    # 2. Set version từ git tag
    - name: Set BUILD_VERSION
      run: |
        echo "BUILD_VERSION=$(
          git describe --tags $(git rev-list --tags --max-count=1) 2>/dev/null \
          || echo "5.0.0"
        )-b$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
        
    # 3. Setup Java 21
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
        
    # 4. Cache Gradle dependencies
    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: ~/.gradle/caches
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    # 5. Make gradlew executable
    - name: Make gradlew executable
      run: chmod +x gradlew
      
    # 6. Build với stacktrace để debug
    - name: Build with Gradle
      run: ./gradlew build -PbuildVersion="$BUILD_VERSION" --stacktrace
      
    # 7. Upload JAR
    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: orebfuscator-paper
        path: orebfuscator-bukkit/build/libs/*.jar
        
    # 8. Upload log nếu build lỗi
    - name: Upload build log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: ~/.gradle/worker-*/build.log
