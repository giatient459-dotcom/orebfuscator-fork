
name: Build

on:
  - workflow_dispatch
  - push
  - pull_request

jobs:
  build:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set BUILD_VERSION
      run: |
        echo "BUILD_VERSION=$(
          git describe --tags $(git rev-list --tags --max-count=1) 2>/dev/null \
          || echo "5.0.0"
        )-b$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

    - name: Restore cache
      id: cache-restore
      uses: actions/cache/restore@v5
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-maven

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: gradle

    - name: Build with Gradle
      run: |
        chmod +x gradlew
        ./gradlew build -PbuildVersion="$BUILD_VERSION"

    - name: Find and upload JAR
      run: |
        find . -name "*.jar" -not -name "*-sources.jar" -not -name "*-javadoc.jar" -not -path "*/build/tmp/*" -exec cp {} ./orebfuscator-built.jar \;

    - name: Save cache
      if: always() && steps.cache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ~/.m2/repository
        key: ${{ steps.cache-restore.outputs.cache-primary-key }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: orebfuscator-paper
        path: ./orebfuscator-built.jar
