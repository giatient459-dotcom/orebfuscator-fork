name: Build Orebfuscator

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set BUILD_VERSION
      run: |
        echo "BUILD_VERSION=$(
          git describe --tags $(git rev-list --tags --max-count=1) 2>/dev/null \
          || echo "5.0.0"
        )-b$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: gradle

    - name: Build with Gradle
      run: |
        chmod +x gradlew
        ./gradlew build -PbuildVersion="$BUILD_VERSION"

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: orebfuscator-paper
        path: orebfuscator-bukkit/build/libs/*.jar
